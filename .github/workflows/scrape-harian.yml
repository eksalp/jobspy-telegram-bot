# Setiap hari jam 00.37 WIB (tabel TIDAK dikosongkan, Jobly tidak pernah kosong):
#   job 1 "situs"     : semua situs (= /updateall); lowongan situs yang sudah
#                       tidak muncul lagi dihapus setelah situs itu selesai
#   job 2 "carikerja" : Indeed & LinkedIn, 68 kata kunci (= /carikerja semua),
#                       lalu hapus lowongan yang 3 hari tidak muncul lagi
# Job 2 jalan setelah job 1 selesai (berhasil ATAU gagal). Masing-masing punya
# jatah 6 jam sendiri dan mengirim ringkasan sendiri ke Telegram.
#
# Rahasia (Settings -> Secrets and variables -> Actions -> Secrets):
#   TELEGRAM_BOT_TOKEN, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ALLOWED_CHAT_IDS
# Variabel opsional (tab Variables): SCRAPE_ALL_RESULTS (default 20000)
#
# Manual: tab Actions -> "Scrape harian" -> Run workflow.
name: Scrape harian

on:
  schedule:
    # Cron GitHub memakai UTC. 17:37 UTC = 00:37 WIB (sengaja bukan menit :00, jam bulat sering ditunda GitHub) keesokan harinya.
    - cron: "37 17 * * *"
  workflow_dispatch:
    inputs:
      reset:
        description: "Kosongkan tabel jobs dulu sebelum scrape? (biasanya TIDAK perlu)"
        type: boolean
        default: false
      carikerja:
        description: "Jalankan juga Indeed & LinkedIn (68 kata kunci)?"
        type: boolean
        default: true

concurrency:
  group: scrape-harian
  cancel-in-progress: false

env:
  TZ: Asia/Jakarta
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
  SCRAPE_ALL_RESULTS: ${{ vars.SCRAPE_ALL_RESULTS || '20000' }}

jobs:
  situs:
    name: Semua situs (/updateall)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instal library
        run: |
          pip install -r requirements.txt
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Scrape semua situs
        run: |
          if [ "${{ inputs.reset }}" = "true" ]; then
            python jadwal_harian.py --reset
          else
            python jadwal_harian.py
          fi

  carikerja:
    name: Indeed & LinkedIn (/carikerja semua)
    needs: situs
    # Tetap jalan walaupun job situs gagal/timeout, kecuali dimatikan manual.
    if: ${{ always() && (github.event_name == 'schedule' || inputs.carikerja) }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instal library
        run: pip install -r requirements.txt
      - name: Cari kerja (68 kata kunci)
        run: python jadwal_harian.py --carikerja

  # GitHub mematikan jadwal kalau repo 60 hari tanpa aktivitas. Kalau commit
  # terakhir sudah >= 50 hari, buat commit kosong supaya jadwal tetap hidup.
  jaga-jadwal:
    name: Jaga jadwal tetap aktif
    needs: carikerja
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit kosong kalau repo lama tidak berubah
        run: |
          umur=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Commit terakhir $umur hari lalu"
          if [ "$umur" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "jaga jadwal tetap aktif"
            git push
          fi
